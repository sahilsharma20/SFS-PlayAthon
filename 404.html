<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — Springfield Playathon</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#FAFAF8;color:#22304A;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;text-align:center;padding:24px;box-sizing:border-box}
  h1{font-size:28px;margin:0 0 10px;color:#1D3A6E}
  p{margin:0 0 22px;color:#566074}
  a{display:inline-block;padding:14px 26px;border-radius:999px;background:#1D3A6E;color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
  <div>
    <h1>This page doesn’t exist</h1>
    <p>Taking you to the Springfield Playathon website…</p>
    <a id="home" href="/">Go to the website</a>
  </div>
<script>
  // Works for both a GitHub Pages project site (username.github.io/repository/) and a normal domain
  var parts = location.pathname.split('/').filter(Boolean);
  var home = /\.github\.io$/.test(location.hostname) && parts.length ? '/' + parts[0] + '/' : '/';
  document.getElementById('home').href = home;
  setTimeout(function(){ location.replace(home); }, 2500);
</script>
</body>
</html>
